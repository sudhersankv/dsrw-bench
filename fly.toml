app = "dsrw-bench"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "uvicorn swb.dashboard.app:app --host 0.0.0.0 --port 8080"
  runner = "swb worker"

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# The runner has no http service. With no SWB_WORKER_CONFIGS it exits at once and stays stopped.
[[restart]]
  policy = "never"
  processes = ["runner"]

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["runner"]
  size = "shared-cpu-2x"
  memory = "2gb"
