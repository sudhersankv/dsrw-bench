# Spec "Core sweeps" R2. Nine m values per length come from swb.diary.lengths.reversal_ms.
run_id: r2_reversal
root_seed: 102
seeds: {start: 0, count: 30}
replicates: 1
concurrency: 4
tokens_per_day: 8
requires_calibration: true
model_limits:
  jev: {max_days: 2000}
  openjev: {max_days: 2000}
rate_limits:
  NEON_AI_GATEWAY_TOKEN: 200000
cells:
  - world: reversal
    contrasts: ["7pt", high]
    lengths_days: [2000, 8000, 32000]
    policies: [raw, w1000, e700]
    question_keys: [current, act]
  # H3 is registered at m = 2,000, which the geometric grid does not contain.
  - world: reversal
    tag: h3
    contrasts: ["7pt"]
    lengths_days: [32000]
    reversal_ms: [2000]
    policies: [raw, w1000]
    question_keys: [current, act]
